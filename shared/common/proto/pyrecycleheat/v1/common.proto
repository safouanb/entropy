syntax = "proto3";

package pyrecycleheat.v1;

option go_package = "github.com/pyrecycleheat/backend/api/gen/go/pyrecycleheat/v1;pyrecycleheatv1";

import "buf/validate/validate.proto";

// Location represents geographic coordinates (WGS-84)
message Location {
  double latitude = 1 [ (buf.validate.field).double = {gte : -90, lte : 90} ];
  double longitude = 2
      [ (buf.validate.field).double = {gte : -180, lte : 180} ];
}

// Pagination request parameters (1-indexed pages)
message PaginationRequest {
  int32 page = 1 [ (buf.validate.field).int32 = {gte : 1} ];
  int32 page_size = 2 [ (buf.validate.field).int32 = {gte : 1, lte : 200} ];
}

// Pagination response metadata
message PaginationMetadata {
  int32 page = 1;
  int32 page_size = 2;
  int64 total_count = 3;
  int32 total_pages = 4;
  bool has_next = 5;
  bool has_previous = 6;
}
